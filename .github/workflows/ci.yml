name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: 1.70.0
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets -- -D warnings

      - name: Check wasm32 library
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --lib --target wasm32-unknown-unknown

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Stage Windows package
        if: runner.os == 'Windows'
        run: |
          mkdir -p package/presets
          cp target/release/hspfmt.exe README.md CONFIGURATION.md DESIGN.md LICENSE .hspfmt.example package/
          cp -r presets/* package/presets/

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        working-directory: package
        run: 7z a ../hspfmt-windows-x64.zip hspfmt.exe README.md CONFIGURATION.md DESIGN.md LICENSE .hspfmt.example presets

      - name: Upload Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: hspfmt-windows-x64.zip
          archive: false
          if-no-files-found: error
