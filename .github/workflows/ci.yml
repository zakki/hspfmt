name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Stage Windows package
        if: runner.os == 'Windows'
        run: |
          mkdir -p package/presets
          cp target/release/hspfmt.exe README.md CONFIGURATION.md DESIGN.md LICENSE .hspfmt.example package/
          cp -r presets/* package/presets/

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        working-directory: package
        run: 7z a ../hspfmt-windows-x64.zip hspfmt.exe README.md CONFIGURATION.md DESIGN.md LICENSE .hspfmt.example presets

      - name: Upload Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: hspfmt-windows-x64.zip
          archive: false
          if-no-files-found: error
